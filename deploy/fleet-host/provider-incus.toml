url = "https://127.0.0.1:8443"
client_certificate = "/etc/garm/incus-client.crt"
client_key = "/etc/garm/incus-client.key"
tls_server_certificate = "/etc/garm/incus-server.crt"

project_name = "gha-fleet"
include_default_profile = false
secure_boot = true
instance_type = "virtual-machine"

platform_config_file = "/etc/gha-fleet/platform.yaml"
journal_file = "/var/lib/gha-fleet/provider-journal.json"
journal_lock_file = "/var/lib/gha-fleet/provider-journal.lock"
queue_intent_file = "/var/lib/gha-fleet/queue-intents.json"
admission_lease_seconds = 300

diagnostics_directory = "/var/lib/gha-fleet/diagnostics"
diagnostics_retention_hours = 168
diagnostics_max_bundle_bytes = 16777216
diagnostics_max_total_bytes = 1073741824

