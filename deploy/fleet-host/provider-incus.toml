# The fast class shares the standard image, alias and fingerprint: what
# separates it is what it is denied -- no job credential and no Docker -- not
# what is baked in. Pinning the same digest under a second flavor is what the
# alias check in Incus.Validate permits and this is the case it permits it for.
[worker_images.nddev-linux-fast]
alias = "nddev-ubuntu-24.04-amd64-current"
