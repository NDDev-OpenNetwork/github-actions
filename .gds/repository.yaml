schema_version: 1

repository:
  id: "repo_01M0EYTYCS3DNXDHZ0CVKXWWW1"
  display_name: "github-actions"
  roles:
    - "project"
    - "module"
  lifecycle: "active"

provider:
  type: "github"
  installation: "installation:github-opennetwork"
  repository_id: 1336122566
  owner: "NDDev-OpenNetwork"
  name: "github-actions"

classification:
  portfolios:
    - "portfolio:opennetwork-projects"
  visibility_contract: "public"
  data_classification: "public"

product:
  purpose: >-
    Open-source GARM and Incus control-plane components for isolated,
    disposable GitHub Actions runners.
  capabilities:
    - "Observation-only JobAssigned and durable complete-identity admission"
    - "One job per ephemeral Incus container"
    - "Fail-closed GitHub, provider and instance reconciliation"
    - "Bounded diagnostic WAL with verified remote confirmation"
    - "Synthetic configuration examples with no estate data"
  entrypoints:
    - change: "Commands"
      path: "cmd"
    - change: "Engine implementation"
      path: "internal"
    - change: "Synthetic configuration contracts"
      path: "config"
    - change: "Pinned GARM derivative"
      path: "third_party/garm"

policy:
  profiles:
    - "repository-default"
    - "public-module"
    - "github-actions"
  rollout_ring: "standard"

git:
  default_branch: "main"
  integration: "pull-request"
  branch_model: "task-branches"
  handoff_pr: "preferred"
  cleanup: "merged-only"

ci:
  profile: "go"
  go_version: "1.26.6"
  build_command: "go build -trimpath ./..."
  test_command: "go test ./..."
  timeout_minutes: 40
  runner: "ubuntu-latest"

verification:
  commands:
    lint:
      - "go vet ./..."
    test:
      - "go test -race ./..."
    build:
      - "go build -trimpath ./..."
  required:
    - "lint"
    - "test"
    - "build"
  required_contexts:
    - "Gate"

agent:
  context_profile: "project-default"
  generated_agents: false
  serena:
    enabled: false
    provenance_required: false

module:
  contract: "public"
  consumption:
    - "git-submodule"
  compatibility: "commit-contract"
  pin_policy: "default-branch-commit"
  publication:
    registry: "none"
    github_release: "optional"

release:
  mode: "bundle"
