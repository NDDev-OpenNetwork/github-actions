[project]
name = "nddev-runner-benchmark"
version = "0.1.0"
description = "Deterministic Python/uv runner benchmark fixture"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.13.4",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nddev_runner_benchmark"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
