# Desired branch protection for the default branch.
#
# This file is the declaration; `scripts/branch-protection.sh` is the only thing
# that reads it, and it can either compare the live settings against it or apply
# it. The settings themselves live in GitHub and no test can reach them, so what
# holds this honest is `internal/repositorycontract/branch_protection_test.go`:
# it binds the required context below to the workflow that has to produce it.
#
# The shape mirrors the branch-protection API payload field for field, so the
# script stays a mapping rather than a translation. A field GitHub accepts but
# this file omits is a field nobody decided, which is why the whole object is
# written out rather than only the parts that differ from GitHub's defaults.
schema_version: 1

branch: main

required_status_checks:
  # Every proof in ci.yml reports through one aggregate. Requiring that
  # aggregate makes all of them blocking without naming any of them here, so a
  # new job becomes blocking by joining the gate rather than by an operator
  # remembering to add a context. Requiring a leaf proof instead is the failure
  # this file exists to prevent: `Go verify` was the required context while
  # `GARM derivative` could fail and merge anyway.
  #
  # The value is the job's `name:`, not its key. GitHub reports a check run
  # under the display name, so renaming the job in ci.yml detaches protection
  # and leaves it waiting on a context that no longer reports.
  contexts:
    - Gate
  # Require the branch to be up to date before merging. The gate proves a
  # merge candidate, not the branch it was written against.
  strict: true

# A pull request is required, but no approval is. One maintainer plus agents
# work here and a self-approval requirement would be theatre; the proof that
# gates a merge is the gate, not a second pair of eyes. Recorded explicitly so
# that it reads as a decision rather than as a default nobody chose.
required_pull_request_reviews:
  required_approving_review_count: 0
  dismiss_stale_reviews: false
  require_code_owner_reviews: false
  require_last_push_approval: false

# Admins are not exempt. The organization ruleset already grants
# OrganizationAdmin an always-bypass for deletion, force-push and signatures;
# leaving the status check exempt as well would mean no proof is unconditional.
enforce_admins: true

# An unresolved review comment is an open question about the change. Merging
# past one discards it silently.
required_conversation_resolution: true

# Merge commits are how this repository integrates, so linear history is off on
# purpose rather than by omission.
required_linear_history: false

# History on the default branch is append-only. Both are also enforced by the
# organization ruleset; declaring them here means the branch does not depend on
# an org-level rule staying in place.
allow_force_pushes: false
allow_deletions: false

# No user, team or app restriction: the required context is the gate, and a
# push restriction would only move the decision somewhere less visible.
restrictions: null

block_creations: false
lock_branch: false
allow_fork_syncing: false
