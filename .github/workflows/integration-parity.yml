name: Integration runner parity

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Exact integration behavior to exercise
        required: true
        default: parity
        type: choice
        options:
          - parity
          - network-negative
          - timeout
          - cancellation

permissions:
  contents: read

concurrency:
  group: integration-runner-parity
  cancel-in-progress: false

jobs:
  host-docker:
    if: ${{ inputs.mode == 'parity' }}
    name: VM-local Docker boundary
    runs-on: nddev-linux-integration
    timeout-minutes: 10
    steps:
      - name: Validate integration image and daemon boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_OS}" == Linux ]]
          [[ "$(id -un)" == runner ]]
          actual_groups="$(id --groups --name runner | tr ' ' '\n' | LC_ALL=C sort | paste -sd' ' -)"
          if [[ "${actual_groups}" != "docker runner sudo" ]]; then
            printf 'runner groups are %q, expected %q\n' \
              "${actual_groups}" "docker runner sudo" >&2
            exit 1
          fi
          jq -e '
            .schema_version == 2 and
            .runner_version == "v2.336.0" and
            .runner_tool_cache == "/home/runner/actions-runner/_work/_tool" and
            (.toolchains | keys) == ["bun", "go", "rust", "uv"] and
            .image_variant == "integration" and
            .docker_engine_version == "29.1.3" and
            .docker_storage_driver == "overlay2" and
            .docker_cgroup_driver == "systemd" and
            .docker_action_base_ref == "nddev/gha-action-base:busybox-1-1.36.1-6ubuntu3.1" and
            (.docker_action_base_id | test("^sha256:[0-9a-f]{64}$"))
          ' /etc/nddev/image-build.json >/dev/null
          test ! -e /dev/kvm
          test ! -S /run/incus/unix.socket
          test ! -S /var/lib/incus/unix.socket
          test ! -S /var/snap/lxd/common/lxd/unix.socket
          test -S /run/docker.sock
          [[ "$(readlink -f /var/run/docker.sock)" == /run/docker.sock ]]
          [[ "$(stat -c '%U:%G:%a' /run/docker.sock)" == root:docker:660 ]]
          socket_mount="$(findmnt --json --target /run/docker.sock)"
          [[ "$(jq -er '.filesystems | if length == 1 then .[0].target else error("ambiguous socket mount") end' <<<"${socket_mount}")" == /run ]]
          [[ "$(jq -er '.filesystems[0].source' <<<"${socket_mount}")" == tmpfs ]]
          [[ "$(jq -er '.filesystems[0].fstype' <<<"${socket_mount}")" == tmpfs ]]
          systemctl is-active --quiet docker.service
          systemctl is-active --quiet containerd.service
          [[ "$(docker info --format '{{.Driver}}')" == overlay2 ]]
          [[ "$(docker info --format '{{.CgroupDriver}}')" == systemd ]]
          docker buildx version
          docker compose version
          expected_base_id="$(jq -er .docker_action_base_id /etc/nddev/image-build.json)"
          actual_base_id="$(docker image inspect --format '{{.Id}}' \
            nddev/gha-action-base:busybox-1-1.36.1-6ubuntu3.1)"
          [[ "${actual_base_id}" == "${expected_base_id}" ]]
          test ! -e /tmp/nddev-integration-cross-job-sentinel
          install -m 0600 /dev/null /tmp/nddev-integration-cross-job-sentinel

  local-docker-action:
    if: ${{ inputs.mode == 'parity' }}
    name: Local Docker container action
    needs: host-docker
    runs-on: nddev-linux-integration
    timeout-minutes: 10
    steps:
      - name: Prove fresh VM and exact preloaded action base
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /tmp/nddev-integration-cross-job-sentinel
          expected_base_id="$(jq -er .docker_action_base_id /etc/nddev/image-build.json)"
          actual_base_id="$(docker image inspect --format '{{.Id}}' \
            nddev/gha-action-base:busybox-1-1.36.1-6ubuntu3.1)"
          [[ "${actual_base_id}" == "${expected_base_id}" ]]

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Exercise local Docker action semantics
        id: docker-action
        uses: ./.github/actions/docker-parity
        with:
          marker: official-docker-action-ok

      - name: Verify Docker action output
        shell: bash
        env:
          DOCKER_ACTION_OUTPUT: ${{ steps.docker-action.outputs.value }}
        run: |
          set -euo pipefail
          [[ "${DOCKER_ACTION_OUTPUT}" == docker-official-docker-action-ok ]]
          git diff --exit-code
          git status --short

  job-and-service-containers:
    if: ${{ inputs.mode == 'parity' }}
    name: Job and service containers
    needs: local-docker-action
    runs-on: nddev-linux-integration
    timeout-minutes: 10
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
      options: --user=1001:1002 --cap-drop=ALL --security-opt=no-new-privileges
    services:
      web:
        image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
        options: >-
          --health-cmd "wget --quiet --output-document=- http://127.0.0.1/ >/dev/null"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - name: Validate job-container isolation
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_OS}" == Linux ]]
          [[ "$(id -u)" == 1001 ]]
          [[ "$(id -g)" == 1002 ]]
          test -S /var/run/docker.sock
          test -S /run/docker.sock
          [[ "$(readlink -f /var/run/docker.sock)" == /run/docker.sock ]]
          test ! -r /var/run/docker.sock
          test ! -w /var/run/docker.sock
          [[ "$(awk '/^CapEff:/{print $2}' /proc/self/status)" == 0000000000000000 ]]
          [[ "$(awk '/^NoNewPrivs:/{print $2}' /proc/self/status)" == 1 ]]
          getent hosts web >/dev/null
          exec 3<>/dev/tcp/web/80
          printf 'GET / HTTP/1.0\r\nHost: web\r\n\r\n' >&3
          IFS=$'\r' read -r status <&3
          [[ "${status}" == 'HTTP/1.1 200 OK' || "${status}" == 'HTTP/1.0 200 OK' ]]
          exec 3<&-
          exec 3>&-

      - name: Exercise JavaScript action inside job container
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify mounted workspace
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md

  network-negative:
    if: ${{ inputs.mode == 'network-negative' }}
    name: VM and nested-container egress boundary
    runs-on: nddev-linux-integration
    timeout-minutes: 10
    steps:
      - name: Require public egress and deny protected routes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --head \
            --connect-timeout 5 --max-time 10 https://github.com/ >/dev/null

          expect_blocked() {
            local address="$1"
            local port="$2"
            if timeout 3 bash -c "exec 3<>/dev/tcp/${address}/${port}" 2>/dev/null; then
              printf 'protected endpoint %s:%s is reachable from the VM\n' \
                "${address}" "${port}" >&2
              exit 1
            fi
          }
          expect_blocked 192.0.2.1 22
          expect_blocked 192.0.2.1 8443
          expect_blocked 192.0.2.1 9997
          expect_blocked 169.254.169.254 80
          expect_blocked 10.0.0.1 443
          expect_blocked 172.16.0.1 443
          expect_blocked 192.168.0.1 443

          for target in 192.0.2.1:8443 169.254.169.254:80 10.0.0.1:443; do
            address="${target%:*}"
            port="${target##*:}"
            if docker run --rm --network bridge \
              nddev/gha-action-base:busybox-1-1.36.1-6ubuntu3.1 \
              /bin/busybox nc -z -w 2 "${address}" "${port}"; then
              printf 'protected endpoint %s is reachable from a nested container\n' \
                "${target}" >&2
              exit 1
            fi
          done

  timeout:
    if: ${{ inputs.mode == 'timeout' }}
    name: Bounded job timeout
    runs-on: nddev-linux-integration
    timeout-minutes: 1
    steps:
      - name: Wait for runner-enforced timeout
        shell: bash
        run: |
          set -euo pipefail
          trap 'printf "timeout signal received\n"; exit 0' TERM INT
          printf 'integration timeout proof is ready\n'
          sleep 180 &
          wait $!

  cancellation:
    if: ${{ inputs.mode == 'cancellation' }}
    name: In-job cancellation
    runs-on: nddev-linux-integration
    timeout-minutes: 10
    steps:
      - name: Await cancellation signal
        shell: bash
        run: |
          set -euo pipefail
          trap 'printf "cancellation signal received\n"; exit 0' TERM INT
          printf 'integration cancellation proof is ready\n'
          sleep 300 &
          wait $!
