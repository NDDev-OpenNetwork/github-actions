name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A shared group discards older pending runs even when cancellation is false.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  changes:
    name: Derivative inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      garm: ${{ steps.paths.outputs.garm }}
      provider: ${{ steps.paths.outputs.provider }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve the provider's compiled package set
        id: packages
        run: |
          set -euo pipefail
          {
            printf 'directories<<PACKAGES\n'
            ./scripts/provider-package-directories.sh
            printf 'PACKAGES\n'
          } >>"${GITHUB_OUTPUT}"
      - name: Classify derivative inputs
        id: paths
        env:
          PROVIDER_PACKAGE_DIRECTORIES: ${{ steps.packages.outputs.directories }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            printf 'garm=true\nprovider=true\n' >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${BASE_SHA:-${BEFORE_SHA:-}}"
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ || "${base}" == 0000000000000000000000000000000000000000 ]]; then
            printf 'garm=true\nprovider=true\n' >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          git cat-file -e "${base}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          garm=false
          provider=false
          while IFS= read -r changed; do
            case "${changed}" in
              config/garm-derivative.yaml|scripts/build-garm-nddev.sh|third_party/garm/*|internal/garmderivative/*|go.mod|go.sum)
                garm=true
                ;;
            esac
            case "${changed}" in
              config/provider-derivative.yaml|go.mod|go.sum)
                provider=true
                ;;
              *)
                # Every directory the provider binary actually compiles, read
                # from the build graph rather than from a list maintained by
                # hand. The hand-written list named eight of the eighteen
                # internal packages `go list -deps` reports, so a change to
                # internal/cachebroker or internal/queueintent -- both real
                # provider dependencies -- skipped this job entirely and shipped
                # under a manifest digest that no longer described main.
                for directory in ${PROVIDER_PACKAGE_DIRECTORIES}; do
                  case "${changed}" in
                    "${directory}"/*.go) provider=true ;;
                  esac
                done
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRT "${base}" "${HEAD_SHA}")
          printf 'garm=%s\nprovider=%s\n' "${garm}" "${provider}" >>"${GITHUB_OUTPUT}"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go test ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  static:
    name: Static and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal third_party)"
      - run: go vet ./...
      - run: go build -trimpath ./...

  derivative:
    name: Reproducible GARM derivative
    needs: changes
    if: ${{ needs.changes.outputs.garm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make build-garm-derivative

  provider-derivative:
    name: Reproducible provider derivative
    needs: changes
    if: ${{ needs.changes.outputs.provider == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve validated artifact identity
        id: release
        run: |
          set -eu
          {
            printf 'version=%s\n' "$(go run ./cmd/gha-fleet provider-release --field derivative_version)"
            printf 'source_commit=%s\n' "$(go run ./cmd/gha-fleet provider-release --field source_commit)"
            printf 'binary_sha256=%s\n' "$(go run ./cmd/gha-fleet provider-release --field binary_sha256)"
          } >>"${GITHUB_OUTPUT}"
      - name: Resolve the provider's compiled package set
        id: packages
        run: |
          set -euo pipefail
          {
            printf 'directories<<PACKAGES\n'
            ./scripts/provider-package-directories.sh
            printf 'PACKAGES\n'
          } >>"${GITHUB_OUTPUT}"
      - name: Refuse provider source drift after the release commit
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          HEAD_COMMIT: ${{ github.sha }}
          PROVIDER_PACKAGE_DIRECTORIES: ${{ steps.packages.outputs.directories }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${SOURCE_COMMIT}" "${HEAD_COMMIT}"
          drift=false
          while IFS= read -r changed; do
            case "${changed}" in
              *_test.go) continue ;;
              go.mod|go.sum)
                printf 'provider release source drift: %s\n' "${changed}" >&2
                drift=true
                continue
                ;;
            esac
            for directory in ${PROVIDER_PACKAGE_DIRECTORIES}; do
              case "${changed}" in
                "${directory}"/*.go)
                  printf 'provider release source drift: %s\n' "${changed}" >&2
                  drift=true
                  ;;
              esac
            done
          done < <(git diff --name-only --diff-filter=ACMRT "${SOURCE_COMMIT}" "${HEAD_COMMIT}")
          [[ "${drift}" == false ]]
      - name: Checkout exact provider source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.source_commit }}
          path: provider-source
      - name: Rebuild and verify exact provider bytes
        working-directory: provider-source
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          EXPECTED_SHA256: ${{ steps.release.outputs.binary_sha256 }}
        run: |
          set -eu
          for output in provider-a provider-b; do
            CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -ldflags "-buildid= -s -w -X main.version=${VERSION} -X main.commit=${SOURCE_COMMIT}" \
              -o "${RUNNER_TEMP}/${output}" ./cmd/garm-provider-incus-nddev
          done
          cmp "${RUNNER_TEMP}/provider-a" "${RUNNER_TEMP}/provider-b"
          actual_sha256="$(sha256sum "${RUNNER_TEMP}/provider-a" | awk '{print $1}')"
          printf 'provider source=%s expected=%s actual=%s\n' \
            "${SOURCE_COMMIT}" "${EXPECTED_SHA256}" "${actual_sha256}"
          test "${actual_sha256}" = "${EXPECTED_SHA256}"
      - name: Publish verified provider candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: garm-provider-incus-${{ steps.release.outputs.source_commit }}
          path: ${{ runner.temp }}/provider-a
          # Evidence, not transport: the reproducibility gate verified these
          # exact bytes, and 30 days is a declared contract rather than
          # whatever the org default happens to be.
          retention-days: 30
          if-no-files-found: error

  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, test, race, static, derivative, provider-derivative]
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          RACE: ${{ needs.race.result }}
          STATIC: ${{ needs.static.result }}
          DERIVATIVE: ${{ needs.derivative.result }}
          PROVIDER_DERIVATIVE: ${{ needs.provider-derivative.result }}
        run: |
          set -eu
          test "${CHANGES}" = success
          test "${TEST}" = success
          test "${RACE}" = success
          test "${STATIC}" = success
          test "${DERIVATIVE}" = success || test "${DERIVATIVE}" = skipped
          test "${PROVIDER_DERIVATIVE}" = success || test "${PROVIDER_DERIVATIVE}" = skipped
