version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      provider-go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # internal/incusplacement/starlarkexec is a nested module that requires the
  # root module, so the root's dependency graph moving is enough to leave its
  # go.mod stale — `go: updates to go.mod needed`. The harness test shells
  # `go test` and `go vet` into that directory, so the root-only bump in #446
  # turned three CI jobs red without touching a line of its own code. Watching
  # the directory is what keeps the two in step.
  - package-ecosystem: gomod
    directory: /internal/incusplacement/starlarkexec
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # The benchmark fixture is a real npm dependency tree, and nothing watched it.
  # `next` sat at 16.3.0 through two critical advisories — unauthenticated RCE
  # in the image-optimization API and on Windows-hosted servers, both fixed in
  # 16.3.3 — and they surfaced only through advisory scanning, which opens no
  # pull request. Bun reads the same manifest and lockfile the npm ecosystem
  # does, so Dependabot can keep this current the way it keeps the other two.
  - package-ecosystem: npm
    directory: /benchmark/bun-next
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
    labels:
      - dependencies
