  docker_action_base_ref: nddev/gha-action-base:busybox-1-1.36.1-6ubuntu3.1
  # The fleet cache CA (CN NDDev-GHA-Cache-CA, valid to 2036-08-07) signs every
  # member's registry mirror. The estate installs it on every host as the
  # cache trust anchor; the build reads it there, proves this digest and
  # subject, and bakes it into the image's trust store before Docker first
  # starts, because dockerd reads its trust once, at start, from that store.
  registry_mirror_ca:
    path: /etc/gha-fleet/trust/rustfs-ca.pem
