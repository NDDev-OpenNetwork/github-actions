schema_version: 1
backend: openobserve
organization: default

queries:
  - id: job-correlation-latest
    title: Latest correlated project jobs
    stream: fleet_logs
    search_type: logs
    parameters: []
    sql: >-
      SELECT github_repository, github_repository_id, github_workflow_run_id,
      github_run_attempt, github_job_name, github_workflow_ref,
      github_commit_sha, runner_name, instance_name, _timestamp
      FROM "fleet_logs"
      WHERE systemd_unit = 'gha-cache-broker.service'
      AND msg = 'job correlation accepted'
      ORDER BY _timestamp DESC

  - id: runner-causal-timeline
    title: Queue, provider and member timeline for one runner
    stream: fleet_traces
    search_type: traces
    parameters: [RUNNER_NAME]
    sql: >-
      SELECT operation_name, runner_name, queue_job_uuid,
      github_workflow_run_id, github_runner_id, incus_member,
      service_service_version, duration, _timestamp
      FROM "fleet_traces"
      WHERE runner_name = '${RUNNER_NAME}'
      ORDER BY _timestamp ASC

  - id: queue-phase-summary
    title: Queue phase duration summary
    stream: fleet_traces
    search_type: traces
    parameters: []
    sql: >-
      SELECT operation_name, COUNT(*) AS spans,
      AVG(duration) AS avg_duration_us, MAX(duration) AS max_duration_us
      FROM "fleet_traces"
      WHERE operation_name LIKE 'queue.%'
      GROUP BY operation_name
      ORDER BY operation_name

  - id: eligibility-to-start-by-job
    title: Exact eligible-to-runner-start duration by job
    stream: fleet_traces
    search_type: traces
    parameters: []
    sql: >-
      SELECT queue_job_uuid, github_workflow_run_id, github_job_name,
      queue_repository, queue_scale_set, queue_priority,
      SUM(CASE WHEN operation_name IN ('queue.queued', 'queue.assigned',
      'queue.acquiring', 'queue.acquired') THEN duration ELSE 0 END)
      AS eligibility_to_start_us,
      MIN(CASE WHEN operation_name IN ('queue.queued', 'queue.assigned',
      'queue.acquiring', 'queue.acquired') THEN _timestamp END)
      AS first_eligible_at
      FROM "fleet_traces"
      WHERE operation_name IN ('queue.queued', 'queue.assigned',
      'queue.acquiring', 'queue.acquired', 'queue.running')
      GROUP BY queue_job_uuid, github_workflow_run_id, github_job_name,
      queue_repository, queue_scale_set, queue_priority
      HAVING SUM(CASE WHEN operation_name = 'queue.running' THEN 1 ELSE 0 END) > 0
      ORDER BY eligibility_to_start_us DESC

  - id: member-provisioning-summary
    title: Provider provisioning by Incus member
    stream: fleet_traces
    search_type: traces
    parameters: []
    sql: >-
      SELECT incus_member, COUNT(*) AS creates,
      AVG(duration) AS avg_duration_us, MAX(duration) AS max_duration_us
      FROM "fleet_traces"
      WHERE operation_name = 'provider.create_instance'
      AND incus_member IS NOT NULL
      GROUP BY incus_member
      ORDER BY incus_member

dashboards:
  - id: fleet-job-correlation
    title: Fleet job correlation and critical path
    panels:
      - query: job-correlation-latest
        visualization: table
      - query: queue-phase-summary
        visualization: table
      - query: eligibility-to-start-by-job
        visualization: table
      - query: member-provisioning-summary
        visualization: table
