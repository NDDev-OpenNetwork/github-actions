# The queue host.
#
# This file is a platform policy like the four runner files beside it, and it
# declares the same classes, because the queue and the hosts that serve it must
# agree on what a class is. What it does not declare is a hypervisor: no worker
# ever runs here.
#
# So read the incus section as a description of the cluster this host drives,
# not of a local Incus. The provider reaches that cluster over the private
# network -- the endpoint is in /etc/garm/provider-incus.toml -- and asks it for
# capacity; project and storage_pool name what to ask about, and
# project_max_cpu_units is one member's share, which the provider multiplies by
# the number of online members. api_address below is unused here: it is what
# reconcile-incus would bind, and reconcile-incus is never run on this host.
#
# cluster.enabled is false for the same reason. This host is not a member. It
# is the thing in front of the members.

schema_version: 2

platform:
  name: nddev-github-actions
  host: example-services

control_plane:
  manager: garm
  manager_version: v0.2.1-nddev.60
  scheduling_mode: scale-set
  provider: incus
  provider_version: v0.1.5-nddev.59
  provider_interface: v0.1.0
  worker_kind: incus-container
  runner: actions/runner
  runner_version: v2.336.0
  runner_update_policy: image-canary

incus:
  version: v6.0.6
  api_address: 127.0.0.1:8443
  project: gha-fleet
  storage_pool: gha-lvm
  storage_driver: lvm
  storage_size_gib: 200
  project_disk_limit_gib: 120
  network: gha0
  network_cidr: 198.51.100.1/24
  egress_acl: gha-public-egress
  public_host_address: 203.0.113.10
  estate_public_host_addresses:
    - 203.0.113.10
    - 203.0.113.11
    - 203.0.113.12
    - 203.0.113.13
    - 203.0.113.14
  services_host_address: 10.200.0.7
  project_max_instances: 8
  project_max_cpu_units: 10
  project_max_memory_mib: 14336
  cluster:
    enabled: false
  registry_port: 5001
  rustfs_port: 9002
  cache_gateway_port: 9003
  garm_gateway_port: 9443

guardrails:
  require_ephemeral: true
  jobs_per_worker: 1
  warm_instances_unregistered: true
  deny_host_docker_socket: true
  deny_nested_virtualization: true
  deny_private_network_by_default: true
  cpu_scheduling_mode: weighted-overcommit
  hard_memory_excludes_emergency_swap: true
  emergency_swap_schedulable: false
  allow_memory_ballooning: false

host_reserve:
  # Carries nothing but this fleet, so the reserve covers only the control
  # plane and the operating system, measured together at well under a gibibyte.
  #
  # It used to be four rather than two for a reason that no longer holds. The
  # reserve was also the one-minute load ceiling admission compared against, so
  # a single worker took the load past a smaller number on its own and the host
  # then refused to replenish the warm VM it had just consumed. Load is now
  # delegated to the journal on a dedicated host, where exact CPU-unit
  # accounting already exists, so the reserve is free to be what its name says.
  mode: dedicated
  minimum_cpu_units: 2
  minimum_memory_mib: 1024
  minimum_percent: 10
  maximum_fleet_cpu_percent: 98
  minimum_free_disk_percent: 20

pressure_admission:
  required: true
  stale_after_seconds: 90
  heartbeat_seconds: 30
  minimum_closed_seconds: 30
  cpu_some_close: 20
  cpu_some_reopen: 10
  memory_full_close: 1
  memory_full_reopen: 0.1
  io_full_close: 10
  io_full_reopen: 5
  maximum_recent_oom_kills: 0

cache:
  object_store:
    implementation: rustfs
    endpoint_env: GHA_FLEET_RUSTFS_ENDPOINT
    access_key_env: GHA_FLEET_RUSTFS_ACCESS_KEY
    secret_key_env: GHA_FLEET_RUSTFS_SECRET_KEY
    bucket: github-actions-cache
  # The `trust` segment is a literal, not a token: it separates the
  # trust-scoped cache from anything else under the repository prefix. It was
  # missing here, so the declared template described eight segments while the
  # implementation wrote nine and nothing compared them.
  namespace_template: "{organization}/{repository}/trust/{trust}/{platform}/{architecture}/{toolchain}/{lock_digest}/{ref_class}"
  untrusted_write_scope: isolated
  release_write_scope: none

backends:
  - name: linux-amd64-incus-container
    platform: linux
    architecture: amd64
    implementation: incus-container
    failure_domain: example-services
    capabilities:
      docker: true

# Values reflect the current four-member 32-vCPU/64-GiB fleet. Every Linux
# class is a disposable container and every warm target remains zero.
pools:
  - name: nddev-linux-docker-container-canary
    backend: linux-amd64-incus-container
    scale_set_name: nddev-linux-docker-container-canary
    trust: trusted
    resources:
      vcpu: 2
      memory_mib: 4096
      disk_gib: 30
    max_running: 1
    warm:
      target_ready: 0
      max_ready: 0
    capabilities:
      docker: true
      credentials: repository
      network_policy: public-internet
      cache_write_scope: none

  - name: nddev-linux-container-canary
    backend: linux-amd64-incus-container
    scale_set_name: nddev-linux-container-canary
    trust: trusted
    resources:
      vcpu: 2
      memory_mib: 2048
      disk_gib: 20
    max_running: 12
    warm:
      target_ready: 0
      max_ready: 0
    capabilities:
      docker: false
      credentials: none
      network_policy: public-internet
      cache_write_scope: none

  - name: nddev-linux-fast
    backend: linux-amd64-incus-container
    scale_set_name: nddev-linux-fast
    trust: trusted
    # Sized from measurement rather than symmetry with the heavier pools. The
    # job trees this pool exists for -- lint, format, typecheck, secret scan --
    # were observed at 292 to 607 MiB resident on the shared listeners. Four
    # gibibytes left five times the observed peak, which was sized against a
    # standard worker that then held 10240 MiB. Standard is now 4096, so fast
    # is 3072: still four times the observed peak once the 536 MiB guest
    # baseline is counted, and still strictly cheaper than standard, which is
    # the only thing that makes this a separate pool.
    resources:
      vcpu: 2
      memory_mib: 3072
      disk_gib: 30
    # Aggregate across four 8-vCPU / 16-GiB cluster members. The project cap
    # keeps the mixed-class total at 32 vCPU / 56 GiB. Live admission and PSI
    # retain the 10% operating reserve instead of stranding it statically.
    # Incus 6.0.6 placement counts pending creates, so bursts distribute
    # without serializing the container or VM launch path.
    max_running: 12
    warm:
      target_ready: 0
      max_ready: 0
    capabilities:
      docker: false
      credentials: none
      # This asked for github-cache-only, which no bridge implements, so the
      # pool could never be planned and has held zero capacity everywhere. The
      # policy was also wrong for the work: a linter resolves dependencies from
      # npm and PyPI, which GitHub and the local cache alone do not serve.
      #
      # The boundary this pool actually keeps is the one it can: no job
      # credential, no Docker, and the same bounded public egress every pool
      # gets, where the ACL rejects private, metadata, multicast and host
      # ranges before any allow is considered.
      network_policy: public-internet
      # Fast lint/typecheck jobs do not compile release artifacts. Keeping this
      # credential-free also removes guest file injection from their hot path.
      cache_write_scope: none

  - name: nddev-linux-standard
    backend: linux-amd64-incus-container
    scale_set_name: nddev-linux-standard
    trust: trusted
    # Sized from the running fleet, not from symmetry with the host. A live
    # standard worker holding 10240 MiB reported 536 MiB used and 9387 MiB
    # available inside the guest: the VM baseline is the guest OS plus the
    # runner, and the job gets everything above it. Four gibibytes therefore
    # leaves ~3.5 GiB for the job, against light job trees measured at 292 to
    # 607 MiB resident and a fleet exec profile of p50 111s / p95 2209s.
    #
    # The old 4 vCPU / 10240 MiB shape was what capped this pool at one worker
    # per host -- two would have needed 8 CPU units against a project quota of
    # 6 -- and one worker per host is what produced 14880 pool-saturated
    # admission refusals in seven days while p95 queue wait reached 22 hours
    # and host load averaged 0.4 of eight cores. Jobs heavier than this belong
    # in nddev-linux-integration, which keeps 4 vCPU / 8192 MiB for them.
    resources:
      vcpu: 2
      memory_mib: 4096
      disk_gib: 30
    max_running: 12
    warm:
      target_ready: 0
      max_ready: 0
    capabilities:
      docker: false
      credentials: repository
      network_policy: public-internet
      cache_write_scope: trusted

  - name: nddev-linux-integration
    backend: linux-amd64-incus-container
    scale_set_name: nddev-linux-integration
    trust: trusted
    resources:
      vcpu: 4
      memory_mib: 6144
      disk_gib: 50
    max_running: 8
    warm:
      target_ready: 0
      max_ready: 0
    capabilities:
      docker: true
      credentials: repository
      network_policy: public-internet
      cache_write_scope: trusted

  - name: nddev-linux-untrusted
    backend: linux-amd64-incus-container
    scale_set_name: nddev-linux-untrusted
    trust: untrusted
    resources:
      vcpu: 4
      memory_mib: 6144
      disk_gib: 50
    max_running: 8
    warm:
      target_ready: 0
      max_ready: 0
    capabilities:
      docker: true
      credentials: none
      network_policy: public-internet
      cache_write_scope: none

  - name: nddev-linux-release
    backend: linux-amd64-incus-container
    scale_set_name: nddev-linux-release
    trust: release
    resources:
      vcpu: 4
      memory_mib: 6144
      disk_gib: 40
    max_running: 1
    warm:
      target_ready: 0
      max_ready: 0
    capabilities:
      docker: false
      credentials: oidc-only
      network_policy: release-allowlist
      cache_write_scope: none
      egress_allowlist:
        - destination: 203.0.113.20/32
          protocol: tcp
          ports: "22"
          purpose: >-
            SSH deploy of the declaro-platform tenant onto server-nddev-amsterdam
            by example-org/declaro.
        - destination: 203.0.113.21/32
          protocol: tcp
          ports: "22"
          purpose: >-
            SSH ProxyJump for the Priority server staging deployment. The jump
            host alone reaches the internal 10.200.99.19 target.

  # Repository-scoped aliases for the priority Priority development lane. They
  # share the same hosts, images and global admission ledger as the generic
  # classes; distinct names make repository identity available at JobAssigned.
  # Cache delivery stays disabled until Priority has its own reviewed RustFS
  # namespace and credentials.
  - name: nddev-priority-standard
    backend: linux-amd64-incus-container
    scale_set_name: nddev-priority-standard
    trust: trusted
    resources:
      vcpu: 2
      memory_mib: 4096
      disk_gib: 30
    max_running: 12
    warm:
      target_ready: 0
      max_ready: 0
    capabilities:
      docker: false
      credentials: repository
      network_policy: public-internet
      cache_write_scope: none

  - name: nddev-priority-integration
    backend: linux-amd64-incus-container
    scale_set_name: nddev-priority-integration
    trust: trusted
    resources:
      vcpu: 4
      memory_mib: 6144
      disk_gib: 50
    max_running: 8
    warm:
      target_ready: 0
      max_ready: 0
    capabilities:
      docker: true
      credentials: repository
      network_policy: public-internet
      cache_write_scope: none

  - name: nddev-priority-untrusted
    backend: linux-amd64-incus-container
    scale_set_name: nddev-priority-untrusted
    trust: untrusted
    resources:
      vcpu: 4
      memory_mib: 6144
      disk_gib: 50
    max_running: 8
    warm:
      target_ready: 0
      max_ready: 0
    capabilities:
      docker: true
      credentials: none
      network_policy: public-internet
      cache_write_scope: none
