schema_version: 1
artifact: garm
derivative_version: v0.2.1-nddev.47
upstream:
  repository: https://github.com/cloudbase/garm
  release: v0.2.1
  commit: 154638445c3949c1958b01812f69d9a1e4d82684
  release_asset_sha256: 11176acb8a725f914b9b947891b4837d374fb616195562cc0ad45a7be8b6c746
patches:
  - path: third_party/garm/patches/0001-event-driven-reconciliation.patch
    sha256: 2f0571f141e7388d6ea0cb0341549ba5bf5dab26d0006382a71b76655e272d34
    purpose: Wake reconciliation from durable watcher events and keep starting runners out of generic scale-down while retaining periodic and timeout convergence.
  - path: third_party/garm/patches/0002-central-queue-admission.patch
    sha256: 7a4cd4efa8b2c8b072c5de78cd58f2b3367d91938425fdcd58402c77e8a8b1c6
    purpose: Persist sparse JobAssigned UUID identities as observation-only state, acknowledge lifecycle messages after durable transfer so completion cannot be head-of-line blocked, and reserve capacity only after JobAvailable binds AcquireJobs metadata and request IDs.
  - path: third_party/garm/patches/0003-failed-scale-set-runner-cleanup.patch
    sha256: 0cd77616af4160eae7be51f91340841b30e13d4b20ea5873e004c1b81d7879e1
    purpose: Retain failed scale-set instance identity until its pre-created GitHub JIT runner registration is removed, retrying transient cleanup failures before provider and database teardown.
  - path: third_party/garm/patches/0004-direct-jit-provider-handoff.patch
    sha256: d23873baf6689c7e4cc366b14979ad86367ef9e321cb6d5d2745c78e64a3c172
    purpose: Reconstruct the official one-job JIT blob only in the dynamic provider request for explicitly opted-in warm workers and bridge their authoritative JobStarted lifecycle into GARM's existing state machine, leaving the official runner, metadata workers, and unrelated providers unchanged.
  - path: third_party/garm/patches/0005-direct-jit-phase-telemetry.patch
    sha256: 49de677a1c483e58cc009ef8f23d301ef4647ea01aec4100a3e6c49376f7889f
    purpose: Emit secret-free structured phase boundaries and monotonic durations around GitHub AcquireJobs and external-provider creation without changing admission, execution or reconciliation semantics.
  - path: third_party/garm/patches/0006-durable-provider-create-retry.patch
    sha256: 2c5ebf1cc435345cb6cc9646cacbe27206c0c17d0b30f08b5aaeb856d731974c
    purpose: Reserve provider attempts by job identity when bound and otherwise by stable forge-entity plus Scale Set identity, apply bounded exponential backoff and open a durable circuit after eight failures across instance-manager recreation and GARM restart.
  - path: third_party/garm/patches/0007-fast-authoritative-job-reconciliation.patch
    sha256: 3c9631ee2c73eedee90fc2f26a7f87361021236b6a1bc7b7ffffa2f0d1c3c3a3
    purpose: Reconcile queued database jobs against the authoritative GitHub Jobs API after thirty seconds, checking ten per cycle with a one-minute repeat interval instead of leaving cancelled work active for an hour.
  - path: third_party/garm/patches/0008-authoritative-scale-set-job-reconciliation.patch
    sha256: b38bc35afa7a93d703e8e141495ac9e930462feb74e941ee983e98b02d1ee565
    purpose: Reconcile scale-set jobs by paginating their authoritative workflow run, delete only uniquely proven stale records by scale-set identity, and retain ambiguous matrix jobs fail-closed.
  - path: third_party/garm/patches/0009-precreate-provider-admission.patch
    sha256: 6bd28c42a3da9de1b9839d500c2a68d8507bc6f638caf935ccb81fa0fbef5f29
    purpose: Stop scale-up before JIT registration and database instance creation while the shared durable provider circuit blocks the scale-set failure domain, while allowing admitted instances to reserve independent attempt leases.
  - path: third_party/garm/patches/0010-synchronize-instance-manager-state.patch
    sha256: be418618739cc44d0bb2481ad3d6b33f8e7e2ef6b696f70987e8d20aa4df743f
    purpose: Synchronize the instance manager's in-memory lifecycle state immediately after every durable status mutation so a queued wake or ticker cannot replay an invalid transition against newer database state.
  - path: third_party/garm/patches/0011-protect-incomplete-provider-lifecycle.patch
    sha256: 7c77950cabfd74ddd5d3d0bb65b823aa61ebc1605c3ad97e88a195a7e242f29f
    purpose: Keep pending and creating scale-set instances out of timeout and missing-registration teardown until provider creation reaches a terminal lifecycle state.
  - path: third_party/garm/patches/0012-require-admitted-intent-before-scale-up.patch
    sha256: 5bc07422308b630f0a005ce6ae7212428ea386d235e3ac75cb71046c18713f2e
    purpose: Refuse stale desired-capacity scale-up before JIT registration or database instance creation unless a durable admitted queue intent still needs capacity.
  - path: third_party/garm/patches/0013-wake-capacity-after-delete.patch
    sha256: 953e671d0d14dd64cdb9930ac5fa4ef6e62ba08438277e7bd385f138345c6e2e
    purpose: Back off saturated scale sets without provider-call churn and clear only capacity deferrals after deletion of a worker with a proven provider identity actually releases resources.
  - path: third_party/garm/patches/0014-refresh-terminal-instance-state.patch
    sha256: 43d3a7cf1986c1e00250053c82a0996bbf40263ab410c679258bff72cf6d1b00
    purpose: Re-read authoritative instance rows in both instance-manager and scale-set removal paths so a concurrent terminal delete or newer lifecycle state cannot be rewritten to pending-delete.
  - path: third_party/garm/patches/0015-authoritative-terminal-delete.patch
    sha256: 50123c3502e060566b4a78f55f850ae36b37f25988d200b10c6cec414a6655ac
    purpose: Force the terminal database commit only after provider deletion succeeds so a concurrent stale intermediate state cannot strand an already absent VM.
  - path: third_party/garm/patches/0016-recheck-terminal-delete-conflict.patch
    sha256: 60254f449fd0175db2636108cc65b8ea761a7b3933b1b185d6417ba48caffecb
    purpose: Re-read authoritative state after a pending-delete update conflict so a concurrent terminal owner wins without an invalid deleted-to-pending-delete retry loop.
  - path: third_party/garm/patches/0017-authoritative-queue-intent-reconciliation.patch
    sha256: fb67643be9a2ddce1eab86182cf844bceda7f6d40b3e8386fc7c5d4fd2caa5ad
    purpose: Release one exact queue intent before deleting a GitHub-authoritatively stale scale-set DB job, retaining both state surfaces when identity is ambiguous or journal reconciliation fails.
  - path: third_party/garm/patches/0018-oldest-first-stale-job-reconciliation.patch
    sha256: 7e8822d4bd13dcab7990e15df38e828211609f2c20afb4d9721f524a617b0cb2
    purpose: Sort stale workflow-job reconciliation oldest-first before the bounded API batch so continuous new work cannot starve cancelled rows indefinitely.
overlays:
  - path: third_party/garm/overlay/workers/scaleset/queue_intent.go
    sha256: 3456b598d57b970a7681f594d617d8910cf142835d810a3675e3a6acd08e5b28
    purpose: Fsync-backed central queue admission where sparse JobAssigned owns a short provisional token to bootstrap an empty scale set, JobAvailable binds complete AcquireJobs identity, pre-execution states have phase TTLs, and priority aging, repository quotas, weighted stride scheduling and completion-driven promotion remain durable without message redelivery.
  - path: third_party/garm/overlay/workers/scaleset/queue_intent_test.go
    sha256: 0ffa39e4ff239ee830279c3427ab57523e89daf154949e81aa353355ac10e7d9
    purpose: Deterministic provisional bootstrap, one-time legacy migration, phase expiry, priority, fairness, width, idempotency, message acknowledgement, crash expiry and concurrent-selection tests.
  - path: third_party/garm/overlay/workers/provider/nddev_create_retry.go
    sha256: 2ac19df649b166a1ea987bb491200baae5fcc846446ff9faef402972c2b43b27
    purpose: Fsync-backed per-instance attempt leases with saturating parallel domain counters, complete capacity classification, bounded provider-failure circuits, one-grant-per-deletion capacity wake and one-hour garbage collection of expired non-terminal records.
  - path: third_party/garm/overlay/workers/provider/nddev_create_retry_test.go
    sha256: 73ff35df51cae78dd222cb84457930424a678815e687afd10a8061bfcf17913e
    purpose: Prove attempts survive process recreation, concurrent failures saturate without corrupting the journal, every admission/storage pressure reason remains capacity, one resource release wakes exactly one oldest capacity domain, stale non-terminal state is collected and success clears durable state.
