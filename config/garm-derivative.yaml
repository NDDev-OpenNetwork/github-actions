schema_version: 1
artifact: garm
derivative_version: v0.2.1-nddev.95
upstream:
  repository: https://github.com/cloudbase/garm
  release: v0.2.1
  commit: 154638445c3949c1958b01812f69d9a1e4d82684
  release_asset_sha256: 11176acb8a725f914b9b947891b4837d374fb616195562cc0ad45a7be8b6c746
patches:
  - path: third_party/garm/patches/0001-event-driven-reconciliation.patch
    sha256: 2f0571f141e7388d6ea0cb0341549ba5bf5dab26d0006382a71b76655e272d34
    purpose: Wake reconciliation from durable watcher events and keep starting runners out of generic scale-down while retaining periodic and timeout convergence.
  - path: third_party/garm/patches/0002-central-queue-admission.patch
    sha256: 7a4cd4efa8b2c8b072c5de78cd58f2b3367d91938425fdcd58402c77e8a8b1c6
    purpose: Persist sparse JobAssigned UUID identities as observation-only state, acknowledge lifecycle messages after durable transfer so completion cannot be head-of-line blocked, and reserve capacity only after JobAvailable binds AcquireJobs metadata and request IDs.
  - path: third_party/garm/patches/0003-failed-scale-set-runner-cleanup.patch
    sha256: 0cd77616af4160eae7be51f91340841b30e13d4b20ea5873e004c1b81d7879e1
    purpose: Retain failed scale-set instance identity until its pre-created GitHub JIT runner registration is removed, retrying transient cleanup failures before provider and database teardown.
  - path: third_party/garm/patches/0004-direct-jit-provider-handoff.patch
    sha256: d23873baf6689c7e4cc366b14979ad86367ef9e321cb6d5d2745c78e64a3c172
    purpose: Reconstruct the official one-job JIT blob only in the dynamic provider request for explicitly opted-in warm workers and bridge their authoritative JobStarted lifecycle into GARM's existing state machine, leaving the official runner, metadata workers, and unrelated providers unchanged.
  - path: third_party/garm/patches/0005-direct-jit-phase-telemetry.patch
    sha256: 49de677a1c483e58cc009ef8f23d301ef4647ea01aec4100a3e6c49376f7889f
    purpose: Emit secret-free structured phase boundaries and monotonic durations around GitHub AcquireJobs and external-provider creation without changing admission, execution or reconciliation semantics.
  - path: third_party/garm/patches/0006-durable-provider-create-retry.patch
    sha256: ce5b84a530077b0431669521e9de57d56b1722b968145c9b84ed62d15566aa31
    purpose: Reserve a stable queue-intent retry identity before every pre-job provider create and release the ephemeral mapping after success, failure, or a deferred preflight, while preserving the job attempt counter across fresh instance names.
  - path: third_party/garm/patches/0007-fast-authoritative-job-reconciliation.patch
    sha256: 3c9631ee2c73eedee90fc2f26a7f87361021236b6a1bc7b7ffffa2f0d1c3c3a3
    purpose: Reconcile queued database jobs against the authoritative GitHub Jobs API after thirty seconds, checking ten per cycle with a one-minute repeat interval instead of leaving cancelled work active for an hour.
  - path: third_party/garm/patches/0008-authoritative-scale-set-job-reconciliation.patch
    sha256: b38bc35afa7a93d703e8e141495ac9e930462feb74e941ee983e98b02d1ee565
    purpose: Reconcile scale-set jobs by paginating their authoritative workflow run, delete only uniquely proven stale records by scale-set identity, and retain ambiguous matrix jobs fail-closed.
  - path: third_party/garm/patches/0009-precreate-provider-admission.patch
    sha256: 6bd28c42a3da9de1b9839d500c2a68d8507bc6f638caf935ccb81fa0fbef5f29
    purpose: Stop scale-up before JIT registration and database instance creation while the shared durable provider circuit blocks the scale-set failure domain, while allowing admitted instances to reserve independent attempt leases.
  - path: third_party/garm/patches/0010-synchronize-instance-manager-state.patch
    sha256: be418618739cc44d0bb2481ad3d6b33f8e7e2ef6b696f70987e8d20aa4df743f
    purpose: Synchronize the instance manager's in-memory lifecycle state immediately after every durable status mutation so a queued wake or ticker cannot replay an invalid transition against newer database state.
  - path: third_party/garm/patches/0011-protect-incomplete-provider-lifecycle.patch
    sha256: 7c77950cabfd74ddd5d3d0bb65b823aa61ebc1605c3ad97e88a195a7e242f29f
    purpose: Keep pending and creating scale-set instances out of timeout and missing-registration teardown until provider creation reaches a terminal lifecycle state.
  - path: third_party/garm/patches/0012-require-admitted-intent-before-scale-up.patch
    sha256: 5bc07422308b630f0a005ce6ae7212428ea386d235e3ac75cb71046c18713f2e
    purpose: Refuse stale desired-capacity scale-up before JIT registration or database instance creation unless a durable admitted queue intent still needs capacity.
  - path: third_party/garm/patches/0013-wake-capacity-after-delete.patch
    sha256: 953e671d0d14dd64cdb9930ac5fa4ef6e62ba08438277e7bd385f138345c6e2e
    purpose: Back off saturated scale sets without provider-call churn and clear only capacity deferrals after deletion of a worker with a proven provider identity actually releases resources.
  - path: third_party/garm/patches/0014-refresh-terminal-instance-state.patch
    sha256: 43d3a7cf1986c1e00250053c82a0996bbf40263ab410c679258bff72cf6d1b00
    purpose: Re-read authoritative instance rows in both instance-manager and scale-set removal paths so a concurrent terminal delete or newer lifecycle state cannot be rewritten to pending-delete.
  - path: third_party/garm/patches/0015-authoritative-terminal-delete.patch
    sha256: 50123c3502e060566b4a78f55f850ae36b37f25988d200b10c6cec414a6655ac
    purpose: Force the terminal database commit only after provider deletion succeeds so a concurrent stale intermediate state cannot strand an already absent VM.
  - path: third_party/garm/patches/0016-recheck-terminal-delete-conflict.patch
    sha256: 60254f449fd0175db2636108cc65b8ea761a7b3933b1b185d6417ba48caffecb
    purpose: Re-read authoritative state after a pending-delete update conflict so a concurrent terminal owner wins without an invalid deleted-to-pending-delete retry loop.
  - path: third_party/garm/patches/0017-authoritative-queue-intent-reconciliation.patch
    sha256: fb67643be9a2ddce1eab86182cf844bceda7f6d40b3e8386fc7c5d4fd2caa5ad
    purpose: Release one exact queue intent before deleting a GitHub-authoritatively stale scale-set DB job, retaining both state surfaces when identity is ambiguous or journal reconciliation fails.
  - path: third_party/garm/patches/0018-oldest-first-stale-job-reconciliation.patch
    sha256: 7e8822d4bd13dcab7990e15df38e828211609f2c20afb4d9721f524a617b0cb2
    purpose: Sort stale workflow-job reconciliation oldest-first before the bounded API batch so continuous new work cannot starve cancelled rows indefinitely.
  - path: third_party/garm/patches/0019-authoritative-live-job-rehydration.patch
    sha256: fe74bd962cfe3b361b64db9b4a584f1ad998af3c3789efd35d5dfd2780157485
    purpose: Reconcile one bounded queue intent when GitHub authoritatively confirms an acknowledged JobAssigned DB row is still queued, allowing the overlay to restore missing ownership or bind repository identity without inventing work.
  - path: third_party/garm/patches/0020-reachable-scale-set-job-reconciliation.patch
    sha256: 24661113a5fa3db00fc12f57da9764b1c5dc2c112e0a14b50eb39ffa9f6079ae
    purpose: Query scale-set protocol rows through a dedicated bounded SQL path so authoritative cleanup and live-job rehydration are reachable without leaking those rows into ordinary webhook pool consumption.
  - path: third_party/garm/patches/0021-reap-idle-offline-jit-runner.patch
    sha256: cb072aeacbbfa2761dc9fb9ec0799e9e2116135bdaf70372ed388205f89868f2
    purpose: Reap a timed-out idle ephemeral runner only after the authoritative GitHub runner list proves it absent or offline, closing a permanent covered-instance capacity leak while retaining active and ambiguous runners.
  - path: third_party/garm/patches/0022-bound-capacity-probe-burst.patch
    sha256: d4a4f73c5a45708149edc9782c2772cede3c1bc9fcb523be07d4f9c98f51fc4b
    purpose: Create at most one new JIT runner per scale-set reconciliation edge so a saturated fleet records one capacity probe and durable backoff instead of a target-sized herd of doomed instance rows and deletes.
  - path: third_party/garm/patches/0023-backoff-authoritative-access-refusal.patch
    sha256: 45edfadc2668cc413f0409d1b3924d52127630ee3086009907fccdbe992eb7a8
    purpose: Defer an entity's authoritative job reads for fifteen minutes after GitHub returns 403 or 429 so missing permission or rate limiting remains fail-closed without consuming API budget once per stale row every minute.
  - path: third_party/garm/patches/0024-preserve-running-queue-intent.patch
    sha256: 7af194cfa81d35f9778830c8772d3bf49c465920c4cb7d04f204ea21a25ebe6c
    purpose: Bind authoritative repository identity before deleting a stale queued database duplicate for a GitHub in-progress job without releasing its running central admission intent; binding failures retain the row for retry, while terminal or absent jobs still release capacity exactly once.
  - path: third_party/garm/patches/0025-fix-scaleset-delete-error-handling.patch
    sha256: 9d3e6a6acccc66424461986905e3343f559c156fd5835adce6b2617b3bee777e
    purpose: Treat an already-absent GitHub runner scale set as idempotent success so local cleanup completes, while returning real remote deletion failures without falsely deleting local state.
  - path: third_party/garm/patches/0026-normalize-registration-token-errors.patch
    sha256: e3c09371d7a67072e1185afc09db823b5ccdc3ce6e524e5e504bc101cd4e06f0
    purpose: Normalize GitHub registration-token API failures through the shared typed error mapping so repository 404 responses remain detectable through wrapped scale-set operations.
  - path: third_party/garm/patches/0027-bound-upstream-download-attempts.patch
    sha256: 35f257c8016c7999c8780970f673c5b35e04b3b3301565cffea0bd242e168456
    purpose: Bound every upstream Linux and Gitea bootstrap curl path to two retries after the initial attempt so GARM and the provider enforce the same three-total-attempt contract.
  - path: third_party/garm/patches/0028-terminal-workflow-run-reconciliation.patch
    sha256: 3bc2722e87f1721c6094130d0f07310a796bf8074504ef121acac8ca7402887c
    purpose: Treat a completed workflow run as authoritative over a queued child job so cancelled runs release their exact queue intent and cannot be resurrected during scale-set reconciliation.
  - path: third_party/garm/patches/0029-scale-up-from-admitted-intent.patch
    sha256: e63c57a3c0a9d492ba45bc35f02e1f9abbc84e7e7923717b3be6ff45206f8a0d
    purpose: Enter demand reconciliation from durable admitted ownership even when the persisted GitHub count is zero; the later confirmed-demand patch gates actual JIT registration.
  - path: third_party/garm/patches/0030-confirm-live-scale-set-demand.patch
    sha256: 102aebd1fb51a7d4bd619fbbb5ab6e3e5706677e35cdbd6c76663640a24f1497
    purpose: Confirm current GitHub scale-set demand with a bounded read before JIT registration, preserving admission limits and queued identities while rejecting stale local-only demand.
  - path: third_party/garm/patches/0031-retire-excess-idle-online-runners.patch
    sha256: 62f8a273e86ed19fe80905ad7205fbf5d6fdefdf1847cc085303c613db3f1345
    purpose: Require Actions RemoveRunner to return 204 and call warnIdleRetirement before the original consolidateRunnerState body so idle-retirement failures cannot block absent-runner consolidation while runner locks stay held until that function returns.
  - path: third_party/garm/patches/0032-exact-scale-set-job-identity.patch
    sha256: 396eea6c1ee9250843ed8002e57658c8a1a6d853423ecba7ed5f85442ec59d9c
    purpose: Bind scale-set stale-job mutation to check-run external_id, workflow_job.check_run_url path ID, repository, exact attempt, numeric job ID and source SHA. A name is a search hint only. Missing fields, omitted or changing page totals, incomplete pagination, wrong URL, wrong scale-set, non-Actions producer, access refusal and no exact match retain the intent.
  - path: third_party/garm/patches/0033-live-message-demand-authority.patch
    sha256: e2a9bb7cc787a3c1dc7bfe4c8e1af458cff8ed77ddd8d5b135c0402bef4a5dbb
    purpose: Treat statistics.TotalAssignedJobs from the current MESSAGE session as scaling authority. Idle retirement requires a recent MESSAGE with messageID>0. A replayed MESSAGE with the same session and messageID does not refresh observedAt. A late message from a replaced session does not replace current demand. Session-create zeros and 202/nil long-polls are not idle evidence. Start failure deletes the new session and cancels the listener context. Accessors are mux-protected.
  - path: third_party/garm/patches/0034-bump-golang-x-text-v0.39.0.patch
    sha256: 2d23c290fe462553607739afeccca2fe1dcc13d2352e6324464f35fa3ffb6bc2
    purpose: Upgrade the one source-reachable advisory, golang.org/x/text, to v0.39.0. x/mod v0.37.0 and x/sync v0.21.0 are required transitives of that release. OpenPGP is not imported.
  - path: third_party/garm/patches/0035-reconcile-journal-without-db-row.patch
    sha256: 1544734007932649e58af7d0b35d83d4e06aeb10a1d1b03d049272953ca0e7b9
    purpose: Feed repository-bound journal entries into the periodic exact GitHub verifier even after DB cleanup; preserve unknown, running, wrong-scope and ambiguous identities, keep bounded per-GUID retry state, and distinguish a complete absent GUID from an incomplete response.
  - path: third_party/garm/patches/0036-refresh-vendored-go-dependencies.patch
    sha256: 2417a1ff7ec61f3e03311ece1ee32d38ecb9f4e1e4efb2d43ab48e10d371f509
    purpose: Update the vendored Go dependency closure and language/toolchain pins to reviewed compatible current releases; preserve offline test/build reproducibility and remove obsolete advisory-bearing x packages.
overlays:
  - path: third_party/garm/overlay/workers/scaleset/queue_intent.go
    sha256: 4b1b9e926a7492423c5ef118ec2a8c0793211e622d16ef37a94f8b2b75604915
    purpose: Fsync-backed central queue admission that excludes terminal capacity, gives completion precedence in fast start/complete batches, requests fresh demand when persisted desired is zero, demotes an expired never-started assigned waiter to queued instead of deleting it, refreshes queued TTL up to the execution horizon, FIFO-orders by FirstQueuedAt, treats listener JobCompleted as a delivery-reservation end rather than a REST workflow-job terminal, does not alias a later same-run/name GUID onto that waiter, does not delete or rename an assigned waiter because an unrelated JobStarted arrived, and yields request-less occupancy only when a dispatchable JobAvailable would actually fit after that yield.
  - path: third_party/garm/overlay/workers/scaleset/queue_intent_test.go
    sha256: abafa5100ee6bbf8ee1dd94d79e34222a3fbc5ed628c022487137896cd1fc5dd
    purpose: Prove completed batched execution cannot retain running capacity, an admitted waiter requests reconciliation when persisted desired is zero, expired never-started assigned waiters keep FIFO over later JobAssigned tokens, queued waiters refresh until the execution horizon then drop, FirstQueuedAt wins when QueueTime moves, a replacement GUID does not inherit a completed waiter's queue clock, REST still-queued identity clears a listener delivery tombstone, unrelated JobStarted does not consume another GUID's assigned waiter or FIFO clock, a dispatchable JobAvailable takes occupancy from a request-less reservation without deleting it including while that reservation is still unexpired, a quota-blocked available job does not evict a useful foreign bootstrap reservation, same-GUID JobAvailable keeps occupancy, plus bootstrap, fairness, width and acknowledgement coverage.
  - path: third_party/garm/overlay/workers/provider/nddev_create_retry.go
    sha256: 2fd202d890088680ef9257e0a3366855b6e4d216c41a7a8936d7866998021219
    purpose: Fsync-backed schema-v2 instance-to-intent reservations that bind a pre-job create to a queued non-terminal waiter when no assigned intent exists yet, skip terminal lineage from active inventory, and treat job-keyed capacity refusals as cluster backpressure that never opens a 24-hour circuit.
  - path: third_party/garm/overlay/workers/provider/nddev_create_retry_test.go
    sha256: c52b783f1b420a3bb15fdc3ca7a445e295251e82e64a85f4d2b41de474546eff
    purpose: Prove a pre-job create binds the live queued waiter rather than terminal lineage, unique-owner reconstruction, tenant-qualified shared-capacity ownership, selective terminal pruning, blocked-intent preservation, and fail-closed behavior when every exact intent is blocked.
  - path: third_party/garm/overlay/workers/scaleset/confirmed_demand.go
    sha256: 8a99d172b4aaf7f113081c776bbde471db6f85420bf5eca5a856a40c4e59606b
    purpose: Bound each new JIT registration by the latest live MESSAGE assigned counter from the current listener session. Idle retirement additionally requires a recent MESSAGE with messageID>0. Unknown, invalid or unobserved demand fails closed. A 202/nil long-poll is not a heartbeat and does not expire legitimate scaling.
  - path: third_party/garm/overlay/workers/scaleset/confirmed_demand_test.go
    sha256: bfec56436411c87873b75bf1c398428079202f7b56ce5ed6403ebf84b8c82b2a
    purpose: Prove unknown or unobserved demand cannot allocate, a live session zero does not create, a live positive count can, admission and max runners still cap the target, an invalid count fails closed, session-create zeros are not idle-fresh, a changed generation or messageID after the runner lock cannot confirm idle removal, messageID 0 cannot confirm idle removal, and JobStarted demand cannot confirm idle removal. Gate unit tests, not Worker/DB/HTTP integration.
  - path: third_party/garm/overlay/workers/scaleset/idle_online_retire.go
    sha256: c77cc8fff92b5b23eb4691d24acdd58548f21cce065f9837ad6f2f70fd207eb4
    purpose: Retire excess undemanded idle ephemeral JIT registrations through Actions RemoveRunner after two matching observations, requiring REST busy to be explicit false, a recent MESSAGE assigned-zero, and the same observation immediately before removal. Runner locks are released before the next candidate. Refuses omitted busy, identity change, unknown live message demand, live assigned demand, or JobStillRunningException.
  - path: third_party/garm/overlay/workers/scaleset/idle_online_retire_test.go
    sha256: d8dbd3b5d3ca0c89cc8f869e27e1a074166be705a1b65e76b70e2f6cdf92d7dc
    purpose: Prove omitted REST busy is unknown, Actions list Busy defaults are untrusted, unknown message demand cannot retire idle runners, all-zero live statistics do not prove demand by themselves, mixed identity restarts observation, two matching observations are required before RemoveRunner, empty aged-candidate plans make no API call, and helper RemoveRunner 204+404, 409, unexpected 2xx and non-404 read-back outcomes. These are predicate and fake-client helpers, not Worker/DB/HTTP integration.
  - path: third_party/garm/overlay/runner/pool/scale_set_identity.go
    sha256: a022ffa920b31655e0101ed60263a2375b7f1258f32bb6e44cc16cb55bca5ee2
    purpose: Bind check_run_url and the check URL to an https origin and repos/owner/repo/check-runs/id path. A missing check URL, HTTP, userinfo, foreign host or different repository path does not bind. Page totals that are omitted, change, or fail to match collected IDs still fail closed.
  - path: third_party/garm/overlay/runner/pool/scale_set_identity_test.go
    sha256: 952708658cbd15a489bc9084678ddad4ac27d9ea19a82af53a334e15d5813be6
    purpose: Prove check-run URL parsing requires https, a repository path and a positive ID, rejects foreign origins and missing check URLs, and still accepts GHES api/v3 paths and query strings. Gate unit tests, not Worker/DB/HTTP integration.
  - path: third_party/garm/overlay/runner/pool/authoritative_reconcile_backoff_test.go
    sha256: d0c8f58b0fe98f5aa496dc161d8064b4029f430b8836c1d37f4429f27a7de620
    purpose: Prove GitHub 403 and 429 establish the 15-minute access-refusal backoff, while 404 and 500 retain ordinary per-job retry without extending that backoff. Gate unit tests, not Worker/DB/HTTP integration.
  - path: third_party/garm/overlay/workers/scaleset/queue_reconciliation.go
    sha256: 46bf21b502904d853ef4e4a079283901a39f395c22367237e79d516b094aec58
    purpose: Read bounded non-running repository-bound journal candidates without mutating TTLs, capacity, execution or terminal lineage; retain exact GUID, owner, repository, run and scale-set identities.
  - path: third_party/garm/overlay/workers/scaleset/queue_reconciliation_test.go
    sha256: d11766b2efc01f08a300c48408a1d150d6730160efebcce7feb26f0380f313bb
    purpose: Prove run ID survives new and already-bound authoritative rehydration, conflicting identities and repeats cannot renew state, and candidate reads preserve running, acquired, claimed, foreign, fresh and terminal work.
  - path: third_party/garm/overlay/runner/pool/queue_reconciliation.go
    sha256: 118bd4e553ebe8bc8f9e5a90b039bb36e36b91e27a91995dde213fe5b6225b2f
    purpose: Reconcile at most two journal candidates per pass with a five-minute per-GUID budget. Missing legacy run identity is discovered only in a complete ten-run window spanning thirty minutes before first queue observation plus one minute, then independently verified by exact GitHub GUID/run/attempt/check URL/SHA/scale-set binding.
  - path: third_party/garm/overlay/runner/pool/queue_reconciliation_test.go
    sha256: b5f5e3234984fde3e5afa99a77d848b079f98c73750fe19638526788b52f89fa
    purpose: "Exercise the real periodic entry point with SQLite and the native durable journal: remove an exact completed orphan without any DB row, preserve a running sibling, persist a terminal receipt across restart, reject wrong scale set, access refusal, incomplete/ambiguous discovery, and rate-limit retained in-progress work."
build:
  container_image: docker.io/library/golang@sha256:6860a573025fcd35aba4f1b23e858b1c1dcd425d53fa73562e169a6ab1c2339a
  go_version: go1.27.1
  cgo_enabled: true
  target_os: linux
  target_arch: amd64
  network_during_test_and_build: none
  module_mode: vendor
  tags:
    - osusergo
    - netgo
    - sqlite_omit_load_extension
  reproducible_rebuilds: 2
  maximum_required_glibc: "2.34"
  binary_sha256: 1b4014dbf23eaeffd7706772ce7d080beeb5c9af82f771021aa5c29a9ad27abd
runtime_contract:
  queue_intent_schema_version: 6
  event_driven_scale_set_wake: true
  event_driven_instance_wake: true
  startup_states_protected_from_scale_down: true
  periodic_reconciliation_seconds: 5
  durable_queue_intent_before_acquire: true
  job_assigned_provisional_capacity: true
  job_available_identity_binding_before_acquire: true
  startup_queue_promotion: true
  deferred_available_message_retained: true
  global_max_in_flight: 32
  maximum_background_in_flight: 2
  weighted_repository_fairness: true
  per_repository_limit: 32
  maximum_repository_share_percent_when_contended: 75
  uncontended_repository_may_use_full_capacity: true
  priority_aging_seconds: 300
  failed_scale_set_registration_cleanup: true
  direct_jit_provider_handoff: true
  direct_jit_phase_telemetry: true
  durable_provider_retry: true
  provider_retry_journal_schema_version: 2
  pre_job_retry_identity: durable-queue-intent
  provider_retry_maximum_attempts: 3
  provider_retry_backoff_cap_seconds: 300
  capacity_retry_backoff_cap_seconds: 30
  capacity_retry_wake_after_delete: true
  capacity_retry_single_domain_lease: true
  shared_capacity_probe_domain: true
  shared_capacity_probe_requires_active_queue: true
  bounded_scale_up_capacity_probe: true
  authoritative_job_reconciliation: true
  authoritative_queue_intent_reconciliation: true
  authoritative_repository_binding: true
  authoritative_running_repository_binding: true
  authoritative_idle_offline_runner_reaping: true
  authoritative_idle_online_runner_retirement: true
  authoritative_access_refusal_backoff_seconds: 900
  job_started_runner_identity: true
  job_available_correlation_binding: true
  job_started_numeric_runner_identity: true
  immutable_same_phase_entry_time: true
  weighted_cpu_memory_admission: true
  priority_zero_capacity_reservation: true
  job_reconciliation_interval_seconds: 30
  job_reconciliation_batch_size: 10
  official_actions_runner_unchanged: true
