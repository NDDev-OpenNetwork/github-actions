schema_version: 2
backend: openobserve
organization: default
rules:
  # Every rule that reads an OTel signal-event stream must aggregate the host
  # out of the pipeline's own labels. Those streams carry a `start_time` label
  # that changes with each counter run, so an unaggregated expression returns
  # one series per run, not one per host: the sum below counted a single run
  # instead of the hour, and the alert dispatched once per series.
  #
  # Measured on 2026-09-02: sixteen failed evaluations in two minutes arrived
  # as three series of 4, 4 and 3 -- three identical pages for one incident,
  # re-sent every eleven minutes for the hour the window remembers, while
  # three failures spread across three runs would have summed to one each and
  # never crossed the threshold at all. The same shape sits in
  # audit_suppression_burst and kernel_workqueue_hog, where a counter that
  # restarts hides half the increase.
  - id: alert_evaluation_failed
    severity: page
    query_language: promql
    stream_name: gha_fleet_observability_signal_events
    # The one failure the alerting system cannot report about itself. A failed
    # evaluation writes outcome 3 into alert_states and sends nothing, so the
    # alert goes blind and the silence is indistinguishable from health. Ten
    # such transitions are on record, eight of them in one two-hour stretch
    # during which compute_pressure_observer_missing -- the alert that watches
    # for missing pressure observers -- could not evaluate itself.
    #
    # The journal line is classified into a signal on the services host and
    # counted, which is the same shape the host signals already use. Threshold
    # two rather than zero because a single PromQL timeout under contention is
    # not blindness; three in an hour is.
    #
    # No outer subquery: evaluation and hold are equal, so the renderer emits
    # the windowed sum as written and an hour with no failures returns an empty
    # result rather than error 20008.
    #
    # The counter is delta, not cumulative, and the window is summed rather than
    # spanned. Both were measured on this engine, not assumed. The count
    # connector emits Delta (proved by running it in isolation against the real
    # journal format), and on a sparse series max_over_time - min_over_time
    # returns the span between the first and last sample, not their number: three
    # failures scored 2 and would not have crossed a threshold of two. Worse, a
    # cumulative counter resets when the collector restarts, so a restart plus
    # one failure would have subtracted a post-restart minimum from a
    # pre-restart maximum and paged the on-call over nothing. Summing deltas
    # counts exactly and survives a restart.
    expression: sum by (host_name) (sum_over_time(gha_fleet_observability_signal_events{signal_class="alert_evaluation_failed",aggregation_temporality="AGGREGATION_TEMPORALITY_DELTA"}[1h]))
    operator: ">"
    threshold: 2
    evaluation_seconds: 60
    hold_seconds: 60
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Alert evaluations are failing, so some alert is blind and saying nothing.
    action: Read the OpenObserve scheduler journal for the failing alert ids, and treat every alert as unproven until evaluation recovers.
    recovery: No alert evaluation has failed for an hour.
  - id: audit_suppression_burst
    severity: ticket
    query_language: promql
    stream_name: gha_fleet_host_signal_events
    # The `or vector(0)` that used to close this expression made it return
    # nothing at all. Measured against the live backend: this delta returns
    # per-host values (8, 6, 6, 5 over fifteen minutes) while the same
    # expression with `or vector(0)` appended returns an empty result, and so
    # does `max(gha_fleet_platform_healthy) or vector(0)` against a series that
    # plainly reads 1. `or` discards the result on OpenObserve 0.92 whether or
    # not the left side has data, so the fallback did not cover a sparse window
    # -- it blinded the alert on every window.
    #
    # A window with no events now returns an empty result, which is the honest
    # answer to "how many events", evaluates without error, and does not fire.
    expression: sum by (host_name) (max_over_time(gha_fleet_host_signal_events{signal_class="audit_suppressed",aggregation_temporality="AGGREGATION_TEMPORALITY_CUMULATIVE"}[15m]) - min_over_time(gha_fleet_host_signal_events{signal_class="audit_suppressed",aggregation_temporality="AGGREGATION_TEMPORALITY_CUMULATIVE"}[15m]))
    operator: ">"
    threshold: 30
    # No outer subquery: evaluation and hold are equal, so the renderer emits
    # the windowed delta as written. The delta is already the sustained
    # statement -- "this many events over the window" -- and wrapping it in a
    # second sustained subquery is what made a quiet window fatal: with no
    # samples the inner delta is empty, and an empty vector inside a subquery
    # raises OpenObserve error 20008, "the return value should have been a
    # matrix but got scalar", which records outcome 3 and notifies no one.
    # Reproduced live on kernel_workqueue_hog, whose class had no samples in
    # the last hour. Unwrapped, a quiet window returns an empty result at HTTP
    # 200: no rows, no firing, no error.
    evaluation_seconds: 600
    hold_seconds: 600
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-performance
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Kernel audit delivery is repeatedly suppressing callbacks across the fleet.
    action: Correlate the affected hosts with AppArmor and workload churn, then remove the noisy rule source without weakening audit coverage.
    recovery: No member records more than thirty new suppression notices in a rolling fifteen-minute window for ten minutes.
  - id: collector_queue_near_full
    severity: page
    query_language: promql
    stream_name: otelcol_exporter_queue_size
    expression: max(otelcol_exporter_queue_size) / clamp_min(max(otelcol_exporter_queue_capacity), 1)
    operator: ">"
    threshold: 0.9
    evaluation_seconds: 30
    hold_seconds: 300
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A persistent Collector queue is above ninety percent of capacity.
    action: Restore the backend path or storage before overflow and preserve the queue directory.
    recovery: Queue ratio stays below fifty percent and enqueue/refusal counters remain zero.
  - id: compute_pressure_observer_missing
    severity: page
    query_language: promql
    stream_name: up
    expression: count(up{service_name="pressure-state"} == 1)
    operator: "<"
    threshold: 4
    evaluation_seconds: 30
    hold_seconds: 120
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: One or more compute pressure observers are not being scraped.
    action: Restore the loopback observer or collector target before trusting compute OOM coverage.
    recovery: Exactly four compute pressure targets remain scrapeable.
  - id: compute_pressure_state_stale
    severity: page
    query_language: promql
    stream_name: gha_fleet_pressure_observer_up
    expression: min by (host_name) (gha_fleet_pressure_observer_up)
    operator: "<"
    threshold: 1
    evaluation_seconds: 30
    hold_seconds: 120
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A compute host pressure publication is invalid or stale.
    action: Preserve the local pressure state and restore the publisher before reopening member admission.
    recovery: Every compute pressure observer reports a fresh valid state.
  - id: compute_root_disk_low
    severity: ticket
    query_language: promql
    stream_name: system_filesystem_usage
    expression: sum by (host_name) (system_filesystem_usage{service_namespace="nddev-github-actions",mountpoint="/",state="free"}) / sum by (host_name) (system_filesystem_usage{service_namespace="nddev-github-actions",mountpoint="/",state=~"free|used"})
    operator: "<"
    threshold: 0.2
    evaluation_seconds: 300
    hold_seconds: 900
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A fleet host root filesystem has less than twenty percent free.
    action: Preserve usage evidence and prune only unreferenced rebuildable artifacts before placement loses another member.
    recovery: Every fleet host root filesystem remains at or above twenty percent free.
  - id: diagnostic_export_failure
    severity: page
    query_language: promql
    stream_name: gha_fleet_diagnostic_export_consecutive_failures
    expression: max by (host_name) (gha_fleet_diagnostic_export_consecutive_failures)
    operator: ">"
    threshold: 0
    evaluation_seconds: 30
    hold_seconds: 180
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Durable diagnostic export is failing.
    action: Preserve the spool and restore RustFS routing or credentials without pruning evidence.
    recovery: Consecutive failures and pending backlog return to zero after an exact successful export.
  - id: diagnostic_retention_overdue
    severity: ticket
    query_language: promql
    stream_name: gha_diagnostic_storage_expiration_eligible_objects
    expression: max by (host_name) (gha_diagnostic_storage_expiration_eligible_objects)
    operator: ">"
    threshold: 0
    evaluation_seconds: 300
    hold_seconds: 3600
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Diagnostic objects remain after their S3 lifecycle eligibility boundary.
    action: Preserve object-age counts and lifecycle read-back, then repair RustFS expiry processing without deleting evidence manually.
    recovery: No expiration-eligible diagnostic object remains after the one-hour implementation grace.
  # fleet_platform_unhealthy pages when health is down for two minutes. A
  # reconciler that fails and is restarted by its timer takes health down for
  # one minute at a time, so no rule saw it: on 2026-09-02 the warm pool
  # reconcilers failed eleven times between 09:35Z and 11:00Z and nothing
  # fired, because `max` over the two-minute period read the healthy minute
  # beside each failed one. Counting the unhealthy minutes catches the shape
  # the page is built to miss, and it is a ticket: a fleet that recovers by
  # itself every minute is not an outage, it is a defect with a heartbeat.
  - id: fleet_health_flapping
    severity: ticket
    query_language: promql
    stream_name: gha_fleet_platform_healthy
    expression: count_over_time((min by (host_name) (gha_fleet_platform_healthy) < 1)[30m:1m])
    operator: ">="
    threshold: 3
    evaluation_seconds: 300
    hold_seconds: 900
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Fleet health keeps dipping and recovering within the page's window.
    action: Read gha_fleet_service_up per service for the dipping minutes and find the unit that fails and is restarted by its timer.
    recovery: Fleet health holds for half an hour without a dip.
  - id: fleet_platform_unhealthy
    severity: page
    query_language: promql
    stream_name: gha_fleet_platform_healthy
    expression: max by (host_name) (gha_fleet_platform_healthy)
    operator: "<"
    threshold: 1
    evaluation_seconds: 30
    hold_seconds: 120
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: The authoritative fleet observer reports an unhealthy platform.
    action: Stop promotion work and inspect exact collection errors and service states.
    recovery: Platform health remains one and all correlated gap metrics are zero.
  - id: fleet_visibility_degraded
    severity: ticket
    query_language: promql
    stream_name: gha_fleet_visibility_held_out_members
    # A drain-marked member that is offline makes the cluster listing partial
    # by design: inventory gap counts are unattributable and the observer
    # suppresses them instead of paging. This rule is the guard on that
    # suppression -- a hold that lasts half an hour is either a forgotten
    # drain or a member that failed to come back, and someone must look.
    expression: max by (host_name) (gha_fleet_visibility_held_out_members)
    operator: ">"
    threshold: 0
    evaluation_seconds: 300
    hold_seconds: 1800
    repeat_seconds: 14400
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A drained member has been offline for half an hour, and inventory gaps are suppressed meanwhile.
    action: Finish the maintenance and restore the member, or investigate why it did not come back; gap suppression ends when it does.
    recovery: No cluster member is offline while drain-marked.
  - id: github_correlation_persistent
    severity: page
    query_language: promql
    stream_name: gha_fleet_queue_missing_workflow_run_id_beyond_grace
    # `or` between the two counters returned an empty result on this backend
    # even with both sides present, so this page could not fire. Both operands
    # are non-negative counts compared against zero, so their sum is positive
    # exactly when either is -- the same alert, in an operator the backend
    # evaluates.
    expression: max(gha_fleet_queue_missing_workflow_run_id_beyond_grace) + max(gha_fleet_queue_unbound_repository_beyond_grace)
    operator: ">"
    threshold: 0
    evaluation_seconds: 30
    hold_seconds: 120
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: GitHub run or repository identity has not converged within two minutes.
    action: Correlate the exact queue UUID with JobAssigned, workflow run, provider lease and runner identity without recovering a transient pre-assignment gap.
    recovery: Both age-qualified correlation metrics remain zero while raw transition counters may continue to change.
  - id: host_compliance_observer_missing
    severity: page
    query_language: promql
    stream_name: gha_fleet_host_compliance_observer_up
    expression: count(gha_fleet_host_compliance_observer_up == 1)
    operator: "<"
    threshold: 5
    evaluation_seconds: 60
    hold_seconds: 180
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Kernel or package compliance telemetry is incomplete on a fleet host.
    action: Restore the local observer or its read-only host inputs before declaring package and reboot state current.
    recovery: Exactly five fleet hosts continuously export complete compliance state.
  - id: host_oom_detected
    severity: page
    query_language: promql
    stream_name: gha_fleet_host_oom_kills_total
    expression: max by (host_name) (increase(gha_fleet_host_oom_kills_total[5m]))
    operator: ">"
    threshold: 0
    evaluation_seconds: 30
    hold_seconds: 30
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A fleet host recorded a new OOM kill.
    action: Close admission on the affected member and preserve workload and pressure evidence.
    recovery: No new OOM delta occurs and memory pressure returns inside the promotion envelope.
  - id: host_package_inventory_stale
    severity: ticket
    query_language: promql
    stream_name: gha_fleet_host_package_inventory_age_seconds
    expression: max by (host_name) (gha_fleet_host_package_inventory_age_seconds)
    operator: ">"
    threshold: 129600
    evaluation_seconds: 300
    hold_seconds: 3600
    # Six hours. Staleness only ends when the inventory next runs, and the
    # threshold is already thirty-six hours, so a quarter-hourly repeat says
    # nothing new.
    repeat_seconds: 21600
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A fleet host package inventory has not refreshed for more than thirty-six hours.
    action: Restore the Ubuntu metadata refresh path and preserve apt output before changing package state.
    recovery: Every fleet host package inventory remains younger than thirty-six hours for one hour.
  - id: host_reboot_required
    severity: ticket
    query_language: promql
    stream_name: gha_fleet_host_reboot_required
    expression: max by (host_name) (gha_fleet_host_reboot_required)
    operator: ">"
    threshold: 0
    evaluation_seconds: 300
    hold_seconds: 600
    # Twelve hours, for the same reason as host_standard_updates_available: the
    # flag is set by the package manager and cleared by a reboot, so repeating
    # it every fifteen minutes cannot make the reboot happen sooner.
    repeat_seconds: 43200
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A fleet host still requires a reboot after package maintenance.
    action: Drain jobs naturally and use the rolling reboot procedure while preserving cluster quorum.
    recovery: No fleet host reports a pending reboot for ten minutes.
  # Fires on updates the host's own automation did not take, not on updates
  # that merely appeared. unattended-upgrades runs daily on every fleet host
  # and its allowed origins are the Ubuntu archive and -security, so a
  # security update announced in the afternoon is gone by the next morning
  # without anyone reading a ticket. Ubuntu also phases updates per machine,
  # so the same package reaches the five hosts on five different days: on
  # 2026-09-02 this rule ticketed four times for one set of nine packages,
  # each host as its phase arrived.
  #
  # min_over_time asks the question that is worth a ticket: did the count stay
  # above zero through a full automation cycle? Twenty-six hours covers the
  # daily apt timer plus its randomised delay. A package the automation will
  # never take -- one from noble-updates rather than -security, or a phased
  # one it defers -- still surfaces, one day later, which is when it becomes
  # a human's problem rather than the machine's.
  - id: host_standard_updates_available
    severity: ticket
    query_language: promql
    stream_name: gha_fleet_host_standard_updates_available
    expression: min_over_time((max by (host_name) (gha_fleet_host_standard_updates_available))[26h:10m])
    operator: ">"
    threshold: 0
    evaluation_seconds: 300
    hold_seconds: 3600
    # Twelve hours. Standard updates stay available until someone applies them,
    # so this sent 82 messages over four days for a fact that changed four
    # times. Twice a day is the cadence of the work it asks for.
    repeat_seconds: 43200
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Package updates have sat on a fleet host through a full unattended-upgrades cycle.
    action: Read whether unattended-upgrades is failing or the package is one it will not take (noble-updates, or a phased deferral), then apply the rolling procedure and prove service and runner recovery.
    recovery: Every fleet host has reached zero standard updates at least once in the last twenty-six hours.
  - id: host_swap_high
    severity: ticket
    query_language: promql
    stream_name: system_paging_usage
    expression: max by (host_name) (system_paging_usage{service_namespace="nddev-github-actions",state="used"}) / clamp_min(sum by (host_name) (system_paging_usage{service_namespace="nddev-github-actions"}), 1)
    operator: ">"
    threshold: 0.75
    evaluation_seconds: 300
    hold_seconds: 900
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-performance
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A fleet host has consumed more than seventy-five percent of emergency swap.
    action: Correlate swap occupancy with memory PSI, worker RSS and queue demand; keep swap outside schedulable capacity.
    recovery: Every fleet host remains below seventy-five percent swap usage for fifteen minutes.
  - id: host_swap_thrash
    severity: page
    query_language: promql
    stream_name: system_paging_operations
    expression: sum by (host_name) (rate(system_paging_operations{service_namespace="nddev-github-actions",type="major"}[5m]))
    operator: ">"
    threshold: 67108864
    evaluation_seconds: 30
    hold_seconds: 300
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-performance
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Sustained major paging exceeds sixty-four MiB per second on a fleet host.
    action: Close admission on the affected member and correlate paging direction with memory PSI and active worker reservations.
    recovery: Major paging remains below sixty-four MiB per second for five minutes and memory PSI returns inside the envelope.
  - id: kernel_slab_unreclaimable
    severity: ticket
    query_language: promql
    stream_name: system_memory_usage
    expression: max by (host_name) (gha_fleet_host_slab_unreclaimable_attributed_bytes)
    operator: ">"
    threshold: 2147483648
    evaluation_seconds: 300
    hold_seconds: 900
    # Four hours, not fifteen minutes. This condition clears when a compute
    # member reboots and at no other time, so it held one alerting episode for
    # 23.6 hours and sent 95 messages -- more than a quarter of everything that
    # reached the chat over four days. Six a day says the same thing.
    # Recovery is observed up to four hours late, which is acceptable for a
    # state whose recovery is a reboot you performed on purpose.
    repeat_seconds: 14400
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Unreclaimable kernel slab exceeds two GiB on a fleet host, by memcg-attributed measurement.
    action: This watches the attributed slab of the root cgroup, not the drifting global counter (github-actions#264 -- the counter overstated truth by ~1 GiB under container churn). A real breach means live kernel objects; preserve slab, audit and AppArmor evidence, then let gha-slab-heal drain and reboot the member.
    recovery: Every fleet host remains below two GiB attributed unreclaimable slab after workload churn.
  - id: kernel_workqueue_hog
    severity: ticket
    query_language: promql
    stream_name: gha_fleet_host_signal_events
    # Same `or vector(0)` removal as audit_suppression_burst; see there.
    expression: sum by (host_name) (max_over_time(gha_fleet_host_signal_events{signal_class="kernel_workqueue_hog",aggregation_temporality="AGGREGATION_TEMPORALITY_CUMULATIVE"}[1h]) - min_over_time(gha_fleet_host_signal_events{signal_class="kernel_workqueue_hog",aggregation_temporality="AGGREGATION_TEMPORALITY_CUMULATIVE"}[1h]))
    operator: ">"
    threshold: 10
    # No outer subquery: evaluation and hold are equal, so the renderer emits
    # the windowed delta as written. The delta is already the sustained
    # statement -- "this many events over the window" -- and wrapping it in a
    # second sustained subquery is what made a quiet window fatal: with no
    # samples the inner delta is empty, and an empty vector inside a subquery
    # raises OpenObserve error 20008, "the return value should have been a
    # matrix but got scalar", which records outcome 3 and notifies no one.
    # Reproduced live on kernel_workqueue_hog, whose class had no samples in
    # the last hour. Unwrapped, a quiet window returns an empty result at HTTP
    # 200: no rows, no firing, no error.
    evaluation_seconds: 600
    hold_seconds: 600
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A fleet member repeatedly reports kernel workqueue CPU-hog events.
    action: Correlate the affected member with workqueue identity, host pressure and workload churn before changing admission or kernel policy.
    recovery: No member records more than ten new workqueue-hog notices in a rolling hour for ten minutes.
  - id: lifecycle_assigned_stall
    severity: page
    query_language: promql
    stream_name: gha_fleet_queue_intent_oldest_state_age_seconds
    expression: max by (host_name) (gha_fleet_queue_intent_oldest_state_age_seconds{state="assigned"})
    operator: ">"
    threshold: 300
    evaluation_seconds: 30
    hold_seconds: 300
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: An admitted job has not reached execution within five minutes.
    action: Correlate the exact intent with GitHub, GARM, provider lease and Incus state.
    recovery: Assigned age stays below the phase SLO or authoritative reconciliation releases it.
  - id: lifecycle_created_unbound
    severity: page
    query_language: promql
    stream_name: gha_fleet_provider_created_without_running_identity_oldest_age_seconds
    expression: max by (host_name) (gha_fleet_provider_created_without_running_identity_oldest_age_seconds)
    operator: ">"
    # Fifteen minutes, above the routine tail rather than inside it. Sampled on
    # the live fleet under load, six samples fifty seconds apart: 13 to 21
    # created leases at a time, of which 0 to 3 were past 300 seconds, and the
    # oldest ranged 229 to 392. A threshold of 300 therefore sat inside ordinary
    # pre-start latency and the rule crossed and cleared on a ten-minute cadence
    # while nothing was wrong.
    #
    # A genuinely stuck instance looks different and was observed the same day
    # at 942 seconds. 900 separates the two rather than splitting the tail.
    threshold: 900
    evaluation_seconds: 30
    hold_seconds: 300
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A created worker has no running job identity beyond transition grace.
    action: Verify GitHub absent/offline state before allowing the normal reaper to delete it.
    recovery: No created lease remains unbound beyond five minutes.
  - id: lifecycle_inventory_gap
    severity: page
    query_language: promql
    stream_name: gha_fleet_incus_orphan_instances
    # `or` between the three counters returned an empty result on this
    # backend, so this page has never fired in its life. All three are
    # non-negative counts compared against zero, so their sum is positive
    # exactly when any one of them is.
    #
    # The third term is the beyond-grace count, not the raw one. A one-job
    # container that has finished leaves its running intent uncovered until the
    # broker's reclaim sweeps it, which is ordinary churn: measured over five
    # minutes of normal traffic the raw counter was non-zero in two samples of
    # twenty-four. Paging on that buries the case worth waking for, which is an
    # intent still uncovered after nothing is coming for it.
    expression: max(gha_fleet_incus_orphan_instances) + max(gha_fleet_journal_missing_instances) + max(gha_fleet_queue_uncovered_running_beyond_grace)
    operator: ">"
    threshold: 0
    evaluation_seconds: 30
    hold_seconds: 120
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Queue, provider journal and Incus inventory disagree.
    action: Preserve all three states and recover only from exact authoritative identity.
    recovery: Orphan, missing and uncovered-running metrics remain zero.
  - id: lifecycle_queued_delivery_stall
    severity: page
    query_language: promql
    # The wait, per scale set, not the state clock. The old expression read
    # gha_fleet_queue_intent_oldest_state_age_seconds{state="queued"}, which
    # measures time in the current state; an assigned intent returning to queued
    # restarts it, so it has a ceiling near the assignment timeout. Measured on
    # the live journal: oldest state age 9 minutes against a real oldest wait of
    # 52. This rule could not distinguish a nine-minute queue from an hour-long
    # one and fired on a ten-minute cadence forever.
    #
    # Per scale set because the aggregate hides the case worth paging for. In one
    # sample nddev-linux-integration was at 43 minutes with a p50 of 16 while
    # nddev-linux-standard was at 14; a max over everything reports one number
    # and names no pool.
    stream_name: gha_fleet_queue_oldest_queued_wait_seconds_by_scale_set
    expression: max by (scale_set) (gha_fleet_queue_oldest_queued_wait_seconds_by_scale_set)
    operator: ">"
    # Thirty minutes, not five. Five was the old ceiling's neighbourhood and is
    # ordinary under load: measured p50 waits ran 7 to 16 minutes across pools
    # while the fleet was delivering normally.
    threshold: 1800
    evaluation_seconds: 60
    hold_seconds: 300
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: An eligible queued job has not produced runner delivery progress within five minutes.
    action: Preserve the job and correlate queue intent, provider retry, admission, worker creation and GitHub registration before recovery.
    recovery: Queued age remains below five minutes or the exact job advances without operator cancellation.
  - id: memory_psi_slow_burn
    severity: ticket
    query_language: promql
    stream_name: gha_fleet_host_psi_stall_percent
    expression: max by (host_name) (gha_fleet_host_psi_stall_percent{resource="memory",mode="some",window_seconds="10"})
    operator: ">"
    threshold: 5
    evaluation_seconds: 300
    hold_seconds: 1800
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-performance
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Sustained memory pressure is consuming useful throughput.
    action: Create a capacity ticket with class mix, RSS and queue percentile evidence.
    recovery: Memory PSI remains below five percent for the hold window.
  - id: provider_retry_error_persistent
    severity: page
    query_language: promql
    stream_name: gha_fleet_provider_retry_deferred_records_by_error_class
    expression: sum by (error_class) (gha_fleet_provider_retry_deferred_records_by_error_class{error_class=~"identity|intent|provider|timeout|unknown"})
    operator: ">"
    threshold: 0
    evaluation_seconds: 30
    hold_seconds: 300
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A non-capacity provider-create error remains actively deferred for five minutes.
    action: Correlate the bounded error class with the exact private retry journal and repair identity, intent, provider or timeout ownership without deleting history.
    recovery: All non-capacity deferred retry classes remain zero and affected real jobs reach provider create.
  - id: provider_terminal_circuit
    severity: page
    query_language: promql
    stream_name: gha_fleet_provider_terminal_circuits
    expression: max by (host_name) (gha_fleet_provider_terminal_circuits)
    operator: ">"
    threshold: 0
    evaluation_seconds: 30
    hold_seconds: 60
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: A durable provider-create circuit is blocking an entire scale set.
    action: Preserve the retry journal, fix and verify the provider cause, then use exact CAS recovery while GARM is stopped.
    recovery: Terminal circuit count remains zero and a fresh job reaches provider create and runner online.
  # Measured against a full day of the real metric (2026-09-02, a day with one
  # project's dispatched release CI bursting the priority pools): the rule as
  # written -- above 600 s held for fifteen minutes -- would have fired zero
  # times on every scale set, while jobs waited up to 906 s. The queued wait
  # simply does not stay above ten minutes for a quarter of an hour; the
  # provider assigns the intent first, and the rest of the wait belongs to
  # lifecycle_assigned_stall. A ticket that cannot fire is not a quiet fleet,
  # it is an unwatched one.
  #
  # Episodes in that same day, by (threshold, minutes held): (300, 5) = 18,
  # (300, 10) = 1, (420, 5) = 4, (450, 5) = 3, (540, 5) = 2, (600, 5) = 0,
  # and zero for anything held the fifteen minutes this rule asked for.
  #
  # A ticket must hold at least ten minutes -- that is the rule package's own
  # policy for the class, and it is right -- so the threshold has to come down
  # to where a ten-minute hold can reach. 300 s is also the boundary this
  # rule's own summary names: "between the two-minute objective and the
  # five-minute page". Held ten minutes it fires once on a day like that one,
  # which is what a slow-burn ticket should cost.
  # The wait a developer feels, closed: first queued to runner running, over
  # the jobs that started in the last fifteen minutes. Every other wait rule
  # here reads a gauge that stops when the provider assigns the intent, so on
  # 2026-09-02 the queued gauge peaked at 597 s on three scale sets while jobs
  # waited up to 906 s. This is the number the fleet is judged by, so it is
  # the one that carries the objective: a ticket when the ninetieth percentile
  # of completed waits stays above five minutes for ten.
  - id: queue_started_wait_slow_burn
    severity: ticket
    query_language: promql
    stream_name: gha_fleet_queue_started_wait_p90_seconds_by_scale_set
    expression: max by (scale_set) (gha_fleet_queue_started_wait_p90_seconds_by_scale_set)
    operator: ">"
    threshold: 300
    evaluation_seconds: 300
    hold_seconds: 600
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Jobs that started recently waited longer than the five-minute objective.
    action: Read the queued and assigned phases separately -- queue_wait_slow_burn and lifecycle_assigned_stall name which half of the wait grew -- before adding capacity.
    recovery: The ninetieth percentile of completed waits holds under five minutes for the hold window.
  - id: queue_wait_slow_burn
    severity: ticket
    query_language: promql
    stream_name: gha_fleet_queue_oldest_queued_wait_seconds_by_scale_set
    # Bounded above by the page's threshold so one fact produces one message.
    # This rule and lifecycle_queued_delivery_stall read the identical series;
    # any age past 300s satisfied both, so a single stall opened a ticket and
    # paged on two cadences. Over seven days that pair was 43 of 115 firing
    # transitions. The band below the page is what this rule is actually about
    # -- latency drifting above the objective while no individual job is stuck
    # -- and above it the page is the better message, not a second one.
    #
    # Written as a bool-gated product rather than the obvious filter, because
    # this backend does not evaluate the filter. Measured against the live
    # engine: `vector(200) < 300` returns an empty result, and so does
    # `(vector(200) < 300) or vector(0)` -- the `or` does not fall through an
    # empty left side. `X * (X < bool 300)` returns 200 for 200 and 0 for 400,
    # which is the intent, and it is never empty, so the sustained subquery
    # always receives a matrix.
    expression: max by (scale_set) (gha_fleet_queue_oldest_queued_wait_seconds_by_scale_set) * (max by (scale_set) (gha_fleet_queue_oldest_queued_wait_seconds_by_scale_set) < bool 1800)
    operator: ">"
    threshold: 300
    evaluation_seconds: 300
    hold_seconds: 600
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-performance
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: Queue latency is persistently between the two-minute objective and the five-minute page.
    action: Create a capacity or fairness ticket using phase-specific and class metrics.
    recovery: Queue age remains below two minutes for the hold window, or a stuck job crosses five minutes and lifecycle_queued_delivery_stall owns it instead.
  - id: snapshot_stale
    severity: page
    query_language: promql
    stream_name: gha_fleet_snapshot_stale
    expression: max by (host_name) (gha_fleet_snapshot_stale)
    operator: ">"
    threshold: 0
    evaluation_seconds: 30
    hold_seconds: 120
    destination_ref: fleet_oncall
    enabled: true
    owner: fleet-operations
    runbook: https://github.com/NDDev-OpenNetwork/github-actions/blob/main/docs/runbooks/fleet-alerts.md
    summary: The authoritative observer snapshot is stale.
    action: Restore observer sampling and Collector scrape before trusting other fleet metrics.
    recovery: Snapshot stale is zero and age remains below forty-five seconds.
